name: Hytale source connectivity check
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check OpenHytale API and identify recipe catalogs
        run: python scripts/check_hytale_source.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hytale-source-diagnostic
          path: data/source-status.json
          if-no-files-found: warn
