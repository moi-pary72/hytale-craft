name: Hytale data source monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5,17 * * *'
  push:
    paths:
      - 'scripts/monitor_hytale_sources.py'
      - '.github/workflows/monitor-hytale-sources.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check primary and fallback sources
        run: python scripts/monitor_hytale_sources.py
      - name: Preserve diagnostic snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hytale-source-health
          path: |
            data/source-health.json
            data/openhytale-catalog-index.json
          retention-days: 30
          if-no-files-found: warn
