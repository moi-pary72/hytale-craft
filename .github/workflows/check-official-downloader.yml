name: Verify official Hytale downloader
on:
  workflow_dispatch:
  schedule:
    - cron: '21 7 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official downloader package without credentials
        run: python scripts/check_official_downloader.py
      - name: Save diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-hytale-downloader-check
          path: data/official-downloader-status.json
          retention-days: 30
