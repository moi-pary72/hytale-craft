name: Validate planner and importers
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/audit_repository_data.py
      - run: python -m unittest discover -s tests -v
      - run: node tests/planner.test.js
      - run: node tests/preview.test.js
      - run: node tests/beta.test.js
      - run: node tests/workspace.test.js
      - run: node tests/canonical.test.js
      - run: node tests/catalog_scale.test.js
      - name: Build and audit public beta boundary
        run: |
          python scripts/build_pages.py --data-policy user-only
          python scripts/audit_pages.py
      - name: Install mobile integration test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium ffmpeg
      - name: Mobile Chromium integration
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/browser_smoke.py
          python tests/preview_browser.py
          python tests/pages_browser.py
          python tests/art_browser.py
          python tests/beta_browser.py
          python tests/modes_browser.py
          python tests/advanced_browser.py
          python tests/github_pages_browser.py
      - name: Save mobile beta screenshots and performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-beta-${{ github.sha }}
          path: |
            .private/stage6/home-*.png
            .private/stage6/recipe-*.png
            .private/stage6/sheet-*.png
            .private/stage6/startup.json
            .private/stage6/slow.json
            .private/stage6/maker-*.png
            .private/engine/screens/lab-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Rebuild and audit isolated preview artifact
        if: github.ref == 'refs/heads/codex/https-preview' || github.head_ref == 'codex/https-preview'
        run: |
          python3 scripts/build_pages.py --data-policy user-only
          python3 scripts/audit_pages.py
      - name: Save reviewed user-only dist (no deployment)
        if: github.ref == 'refs/heads/codex/https-preview' || github.head_ref == 'codex/https-preview'
        uses: actions/upload-artifact@v4
        with:
          name: hytale-craft-user-only-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
